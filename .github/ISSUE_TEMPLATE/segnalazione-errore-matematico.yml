name: Segnalazione di errore matematico
description: Segnala una formula, una condizione, una procedura o un riferimento da correggere.
title: "[Errore] "
body:
  - type: input
    id: versione
    attributes:
      label: Versione del formulario
      description: Indica la versione riportata nel PDF.
      placeholder: "v.1.2"
    validations:
      required: true
  - type: input
    id: posizione
    attributes:
      label: Posizione
      description: Indica capitolo, sezione e pagina del PDF.
      placeholder: "Capitolo 7, Limiti di funzione, pagina 64"
    validations:
      required: true
  - type: input
    id: copia
    attributes:
      label: Collegamento o origine della copia consultata
      description: Indica l'URL del PDF oppure specifica se proviene da ingegnerismo.it, GitHub o un altro canale.
      placeholder: "https://ingegnerismo.it/downloads/.../formulario-analisi-matematica-1-v1.2.pdf"
    validations:
      required: true
  - type: textarea
    id: contenuto-attuale
    attributes:
      label: Contenuto attuale
      description: Trascrivi la formula o il passaggio interessato.
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: Problema riscontrato
      description: Spiega con precisione perché il contenuto è errato, ambiguo o incompleto.
    validations:
      required: true
  - type: textarea
    id: correzione
    attributes:
      label: Correzione proposta
      description: Indica la formulazione corretta e le condizioni necessarie.
    validations:
      required: false
  - type: textarea
    id: riferimenti
    attributes:
      label: Riferimenti verificabili
      description: Indica manuale, appunti ufficiali, articolo o calcolo che supporta la segnalazione.
    validations:
      required: false
  - type: checkboxes
    id: conferme
    attributes:
      label: Conferme
      options:
        - label: Ho verificato versione e pagina nella copia indicata.
          required: true
        - label: La segnalazione è originale e non riproduce materiale protetto di terzi.
          required: true
