name: Build and release PDF

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate project
        run: python tools/check_project.py

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build
          texlive_version: 2026
          os: debian

      - name: Prepare distributable files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/main.pdf dist/formulario-analisi-matematica-1.pdf
          git archive --format=zip --output=dist/formulario-analisi-matematica-1-source.zip HEAD
          sha256sum \
            dist/formulario-analisi-matematica-1.pdf \
            dist/formulario-analisi-matematica-1-source.zip \
            > dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: formulario-analisi-matematica-1
          path: |
            dist/formulario-analisi-matematica-1.pdf
            dist/formulario-analisi-matematica-1-source.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/formulario-analisi-matematica-1.pdf
            dist/formulario-analisi-matematica-1-source.zip
            dist/SHA256SUMS.txt
