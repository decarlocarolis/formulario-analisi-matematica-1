name: Compila e pubblica il PDF

on:
  push:
    branches: [main]
    tags: ['v*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilazione:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il deposito
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Controlla la struttura del progetto
        run: python strumenti/controlla_progetto.py

      - name: Verifica che l'etichetta descriva una versione nuova
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          versione_documento="$(python -c 'import json; print(json.load(open("formulario.json", encoding="utf-8"))["documento"]["versione"])')"
          etichetta_documento="v${versione_documento#v.}"
          if [[ "${GITHUB_REF_NAME}" != "${etichetta_documento}" ]]; then
            echo "L'etichetta ${GITHUB_REF_NAME} non coincide con la versione ${versione_documento}." >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "La versione ${GITHUB_REF_NAME} esiste gia ed e immutabile." >&2
            exit 1
          fi

      - name: Compila il documento LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: formulario.tex
          args: -file-line-error -halt-on-error -interaction=nonstopmode -outdir=compilazione
          latexmk_use_xelatex: true
          texlive_version: 2025
          os: debian

      - name: Prepara i file distribuibili
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p distribuzione
          cp compilazione/formulario.pdf distribuzione/formulario-analisi-matematica-1.pdf
          git archive --format=zip --output=distribuzione/formulario-analisi-matematica-1-sorgenti.zip HEAD
          sha256sum \
            distribuzione/formulario-analisi-matematica-1.pdf \
            distribuzione/formulario-analisi-matematica-1-sorgenti.zip \
            > distribuzione/SOMME-DI-CONTROLLO-SHA256.txt

      - name: Conserva i file della compilazione
        uses: actions/upload-artifact@v7
        with:
          name: pacchetto-formulario-analisi-matematica-1
          path: |
            distribuzione/formulario-analisi-matematica-1.pdf
            distribuzione/formulario-analisi-matematica-1-sorgenti.zip
            distribuzione/SOMME-DI-CONTROLLO-SHA256.txt

  pubblicazione:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: compilazione
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scarica il deposito
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Recupera i file verificati
        uses: actions/download-artifact@v7
        with:
          name: pacchetto-formulario-analisi-matematica-1
          path: distribuzione

      - name: Pubblica una nuova versione immutabile su GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "La versione ${GITHUB_REF_NAME} esiste gia: tag e allegati pubblicati sono immutabili." >&2
            echo "Aggiorna i metadati e crea una nuova versione editoriale." >&2
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" \
            distribuzione/formulario-analisi-matematica-1.pdf \
            distribuzione/formulario-analisi-matematica-1-sorgenti.zip \
            distribuzione/SOMME-DI-CONTROLLO-SHA256.txt \
            --title "Formulario di Analisi Matematica I ${GITHUB_REF_NAME}" \
            --notes-file NOTE-DI-PUBBLICAZIONE.md \
            --verify-tag
