name: Compila e pubblica il PDF

on:
  push:
    branches: [main]
    tags: ['v*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilazione:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il deposito
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Controlla la struttura del progetto
        run: python strumenti/controlla_progetto.py

      - name: Compila il documento LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: formulario.tex
          args: -file-line-error -halt-on-error -interaction=nonstopmode -outdir=compilazione
          latexmk_use_xelatex: true
          texlive_version: 2025
          os: debian

      - name: Prepara i file distribuibili
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p distribuzione
          cp compilazione/formulario.pdf distribuzione/formulario-analisi-matematica-1.pdf
          git archive --format=zip --output=distribuzione/formulario-analisi-matematica-1-sorgenti.zip HEAD
          sha256sum \
            distribuzione/formulario-analisi-matematica-1.pdf \
            distribuzione/formulario-analisi-matematica-1-sorgenti.zip \
            > distribuzione/SOMME-DI-CONTROLLO-SHA256.txt

      - name: Conserva i file della compilazione
        uses: actions/upload-artifact@v7
        with:
          name: pacchetto-formulario-analisi-matematica-1
          path: |
            distribuzione/formulario-analisi-matematica-1.pdf
            distribuzione/formulario-analisi-matematica-1-sorgenti.zip
            distribuzione/SOMME-DI-CONTROLLO-SHA256.txt

      - name: Sposta l'etichetta v1.2 sulla correzione editoriale
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[ripubblica-v1.2]')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Automazione Ingegnerismo"
          git config user.email "actions@users.noreply.github.com"
          git tag -f -a v1.2 "${GITHUB_SHA}" \
            -m "Formulario di Analisi Matematica I v.1.2 - correzioni grafiche e tipografiche"
          git push --force origin refs/tags/v1.2

      - name: Crea o aggiorna la versione pubblicata su GitHub
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              distribuzione/formulario-analisi-matematica-1.pdf \
              distribuzione/formulario-analisi-matematica-1-sorgenti.zip \
              distribuzione/SOMME-DI-CONTROLLO-SHA256.txt \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Formulario di Analisi Matematica I ${GITHUB_REF_NAME}" \
              --notes-file NOTE-DI-PUBBLICAZIONE.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              distribuzione/formulario-analisi-matematica-1.pdf \
              distribuzione/formulario-analisi-matematica-1-sorgenti.zip \
              distribuzione/SOMME-DI-CONTROLLO-SHA256.txt \
              --title "Formulario di Analisi Matematica I ${GITHUB_REF_NAME}" \
              --notes-file NOTE-DI-PUBBLICAZIONE.md
          fi
