name: Applica la revisione grafica v.1.2

on:
  push:
    branches: [main]
    paths:
      - aggiornamento-grafico-v1.2-avvia.txt
  pull_request:
    branches: [main]
    paths:
      - attiva-revisione-grafica-v1.2.txt

permissions:
  contents: write

jobs:
  aggiornamento:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il ramo principale
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Ricostruisce e verifica il progetto aggiornato
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/somme-frammenti.sha256 <<'EOF'
          0b96eca427c6f740a080e816850ea278457d946bbbcfe4816a5616ae24093cac  aggiornamento-grafico-v1.2/pacchetto.parte-000
          d0e37f2b38c34080cf13aaa75e62d0b64181d1d9a2603a88e9d7fc9d178a1a52  aggiornamento-grafico-v1.2/pacchetto.parte-001
          454bb6aef122d75781e13a6cb5dc404fd80a0898aa644f1965637db090cbc3f7  aggiornamento-grafico-v1.2/pacchetto.parte-002
          67ed35962356bed164bc8fc24a691e9280dd1c9c458774f4ff65e48884eef948  aggiornamento-grafico-v1.2/pacchetto.parte-003-0
          306d9112aedfa8b0e3c86341241d3f17ce5e167230883ebbab5abe97056015c2  aggiornamento-grafico-v1.2/pacchetto.parte-003-1
          66d200256d73a2bf17bc6f6ff8642b8c819de42913373f2190c301c13b85ea60  aggiornamento-grafico-v1.2/pacchetto.parte-004
          115160ee38ab255df3d2ce7a7f39ae744c75021a5e51c93d980972465c483ae9  aggiornamento-grafico-v1.2/pacchetto.parte-005
          c48379723bb6c52ab5370e42af1a2b90ac4931be21304c5a4efd209d6582e5a2  aggiornamento-grafico-v1.2/pacchetto.parte-006
          11cc0c15015719fb691377b168610d9966e26f2dbe8d4fe3bd49da188cd7fa5e  aggiornamento-grafico-v1.2/pacchetto.parte-007
          4ddabb4ff20c4287e8302fa1950dd03e90a953b42c52786c96055c38c1d8af03  aggiornamento-grafico-v1.2/pacchetto.parte-008
          c86d6ba45cddfd27cacd6359fd1341a7095ab817b479f407112be10d775249e1  aggiornamento-grafico-v1.2/pacchetto.parte-009
          c2c9992f8bfe9af84d15161ae27691977d4d918bd900a793b733d58980f6e1af  aggiornamento-grafico-v1.2/pacchetto.parte-010-0
          88f53316004b954bcab60d149abe23df02e5094e664cb35b3b4b47de6eb95e5a  aggiornamento-grafico-v1.2/pacchetto.parte-010-1
          753a8c3b22c124093cb4249b5f5d74e7e84c381b3282cd62e4e21c4eaecdaf29  aggiornamento-grafico-v1.2/pacchetto.parte-011
          65e98ff048652712c883e1ad06c080b21f510abe04ae37719af962d7222947fe  aggiornamento-grafico-v1.2/pacchetto.parte-012
          65a23b8733e092f3244389eeb04de984b2290e1fc4e8356934aa07c066cec81a  aggiornamento-grafico-v1.2/pacchetto.parte-013
          c436713df3d5d1f1000fc674bc1d1f879cf40ee617172aee21a846eb5450ed45  aggiornamento-grafico-v1.2/pacchetto.parte-014
          2e8d7f3e86fa0159d2cdaa028d98c605401d3ec4bbb6523588c8920a4d9c1280  aggiornamento-grafico-v1.2/pacchetto.parte-015
          EOF
          sha256sum --check /tmp/somme-frammenti.sha256
          {
            cat aggiornamento-grafico-v1.2/pacchetto.parte-000
            cat aggiornamento-grafico-v1.2/pacchetto.parte-001
            cat aggiornamento-grafico-v1.2/pacchetto.parte-002
            cat aggiornamento-grafico-v1.2/pacchetto.parte-003-0
            cat aggiornamento-grafico-v1.2/pacchetto.parte-003-1
            cat aggiornamento-grafico-v1.2/pacchetto.parte-004
            cat aggiornamento-grafico-v1.2/pacchetto.parte-005
            cat aggiornamento-grafico-v1.2/pacchetto.parte-006
            cat aggiornamento-grafico-v1.2/pacchetto.parte-007
            cat aggiornamento-grafico-v1.2/pacchetto.parte-008
            cat aggiornamento-grafico-v1.2/pacchetto.parte-009
            cat aggiornamento-grafico-v1.2/pacchetto.parte-010-0
            cat aggiornamento-grafico-v1.2/pacchetto.parte-010-1
            cat aggiornamento-grafico-v1.2/pacchetto.parte-011
            cat aggiornamento-grafico-v1.2/pacchetto.parte-012
            cat aggiornamento-grafico-v1.2/pacchetto.parte-013
            cat aggiornamento-grafico-v1.2/pacchetto.parte-014
            cat aggiornamento-grafico-v1.2/pacchetto.parte-015
          } > /tmp/aggiornamento-grafico.b64
          base64 --decode /tmp/aggiornamento-grafico.b64 > /tmp/aggiornamento-grafico.tar.xz
          echo "e71b89457b629b797d894508cd4b474ab7cd3f763edc3760c19d589916f559bf  /tmp/aggiornamento-grafico.tar.xz" | sha256sum --check -
          rm -rf /tmp/progetto-aggiornato
          mkdir -p /tmp/progetto-aggiornato
          tar -xJf /tmp/aggiornamento-grafico.tar.xz -C /tmp/progetto-aggiornato
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/progetto-aggiornato/. ./
          python strumenti/controlla_progetto.py

      - name: Compila il PDF per la verifica preventiva
        uses: xu-cheng/latex-action@v4
        with:
          root_file: formulario.tex
          args: -file-line-error -halt-on-error -interaction=nonstopmode -outdir=compilazione
          latexmk_use_xelatex: true
          texlive_version: 2026
          os: debian

      - name: Registra il progetto grafico definitivo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Automazione Ingegnerismo"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Ridisegna il formulario mantenendo la versione v.1.2"
          git fetch origin main
          REVISIONE_ATTESA="$(git rev-parse origin/main)"
          git push --force-with-lease=refs/heads/main:"${REVISIONE_ATTESA}" origin HEAD:main

      - name: Prepara gli allegati della release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p distribuzione
          cp compilazione/formulario.pdf distribuzione/formulario-analisi-matematica-1.pdf
          git archive --format=zip --output=distribuzione/formulario-analisi-matematica-1-sorgenti.zip HEAD
          sha256sum \
            distribuzione/formulario-analisi-matematica-1.pdf \
            distribuzione/formulario-analisi-matematica-1-sorgenti.zip \
            > distribuzione/SOMME-DI-CONTROLLO-SHA256.txt

      - name: Aggiorna l'etichetta e la release v1.2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f -a v1.2 -m "Formulario di Analisi Matematica I v.1.2 - revisione grafica"
          git push --force origin refs/tags/v1.2

          gh release delete-asset v1.2 formulario-analisi-matematica-1-source.zip --yes || true
          gh release delete-asset v1.2 SHA256SUMS.txt --yes || true
          gh release upload v1.2 \
            distribuzione/formulario-analisi-matematica-1.pdf \
            distribuzione/formulario-analisi-matematica-1-sorgenti.zip \
            distribuzione/SOMME-DI-CONTROLLO-SHA256.txt \
            --clobber

          cat > /tmp/note-release.md <<'EOF'
          ## Revisione grafica della versione v.1.2

          La release mantiene il numero **v.1.2** e sostituisce gli allegati precedenti con il formulario ridisegnato e i relativi sorgenti LaTeX canonici.

          Il sistema grafico è derivato dal marchio di ingegnerismo.it e utilizza una gerarchia coerente per copertina, parti, capitoli, procedure, formule chiave, errori frequenti, controlli finali e tabelle. Tutta la documentazione editoriale e tecnica è in italiano.

          Le equazioni differenziali ordinarie restano escluse da questo volume e appartengono al formulario dedicato di EDO e Analisi Numerica.
          EOF

          gh release edit v1.2 \
            --title "Formulario di Analisi Matematica I v.1.2" \
            --notes-file /tmp/note-release.md
