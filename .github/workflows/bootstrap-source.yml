name: Bootstrap canonical LaTeX source v1.2

on:
  push:
    paths:
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore and validate canonical source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.b64.part* > /tmp/formulario-source.b64
          base64 --decode /tmp/formulario-source.b64 > /tmp/formulario-source.tar.xz
          echo "94b179df65cbe7f189eae92ed1dca1b44e1df02078eb7729ad672237374baddb  /tmp/formulario-source.tar.xz" | sha256sum --check -
          mkdir -p /tmp/formulario-source
          tar -xJf /tmp/formulario-source.tar.xz -C /tmp/formulario-source
          cp -a /tmp/formulario-source/. ./
          mkdir -p .github/workflows
          printf '%s' '' | base64 --decode > .github/workflows/build-pdf.yml
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          python tools/check_project.py

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build
          texlive_version: 2026
          os: debian

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import canonical LaTeX source v1.2"
          git push origin HEAD:main

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/main.pdf dist/formulario-analisi-matematica-1.pdf
          git archive --format=zip --output=dist/formulario-analisi-matematica-1-source.zip HEAD
          sha256sum dist/formulario-analisi-matematica-1.pdf dist/formulario-analisi-matematica-1-source.zip > dist/SHA256SUMS.txt

      - name: Publish release v1.2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -a v1.2 -m "Formulario di Analisi Matematica I v.1.2"
          git push origin v1.2
          cat > /tmp/release-notes.md <<'EOF'
          Prima release PDF basata sul sorgente LaTeX canonico.

          Il formulario è orientato alla preparazione degli esami: riconoscimento del problema, scelta del metodo, procedura e controllo del risultato. Le EDO sono escluse e rimangono nel formulario dedicato di EDO e Analisi Numerica.
          EOF
          gh release create v1.2 dist/formulario-analisi-matematica-1.pdf dist/formulario-analisi-matematica-1-source.zip dist/SHA256SUMS.txt --title "Formulario di Analisi Matematica I v.1.2" --notes-file /tmp/release-notes.md
